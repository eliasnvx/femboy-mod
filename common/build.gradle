architectury {
    common(rootProject.platforms.split(","))
}

dependencies {
    // Only for @Environment-style annotations; do NOT use other Fabric Loader classes in common
    compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    api project(":api")
    implementation "dev.architectury:architectury:${rootProject.architectury_api_version}"
    implementation "com.geckolib:geckolib-common-${rootProject.minecraft_version}:${rootProject.geckolib_version}"
    // Soft dependency (SPEC §9): only compat.jei touches it; never loaded without JEI
    compileOnly "mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}"
}

// The Architectury transformer reads :api classes; make sure the api jar is complete first (parallel builds).
tasks.matching { it.name.startsWith("transformProduction") }.configureEach { dependsOn(":api:jar") }

// Dev tool: code cosmetic models -> starting Blockbench/GeckoLib files in art/blockbench (docs/art/blockbench.md)
tasks.register("exportBlockbenchStarters", JavaExec) {
    group = "femboymod"
    description = "Exports every code cosmetic model as a starting .geo.json + flat texture into art/blockbench"
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "dev.eliasnvx.femboymod.tools.BlockbenchStarterExport"
    args rootProject.file("art/blockbench").absolutePath
    // Minecraft's logger writes logs/ into the working directory: keep it out of the source tree
    workingDir = layout.buildDirectory.dir("blockbench-export").get().asFile
    doFirst { workingDir.mkdirs() }
}
