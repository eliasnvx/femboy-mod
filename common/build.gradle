architectury {
    common(rootProject.platforms.split(","))
}

dependencies {
    // Only for @Environment-style annotations; do NOT use other Fabric Loader classes in common
    compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    api project(path: ":api", configuration: "namedElements")
    modImplementation "dev.architectury:architectury:${rootProject.architectury_api_version}"
    modImplementation "software.bernie.geckolib:geckolib-common-${rootProject.minecraft_version}:${rootProject.geckolib_version}"
    // Soft dependency (SPEC §9): only compat.jei touches it; never loaded without JEI
    modCompileOnly "mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}"
}

// The Architectury transformer reads :api classes; make sure the api jar is complete first (parallel builds).
tasks.matching { it.name.startsWith("transformProduction") }.configureEach { dependsOn(":api:jar", ":api:remapJar") }

// The Blockbench starter export (exportBlockbenchStarters) lives on the 26.3 branch only: art is authored there.
