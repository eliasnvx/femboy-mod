architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modImplementation "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    // femboymod itself, so `runClient` here starts the mod + the addon
    implementation project(path: ":fabric", configuration: "namedElements")
    common(project(path: ":api", configuration: "namedElements")) { transitive false }
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    common(project(path: ":example-addon-common", configuration: "namedElements")) { transitive false }
}

// Addon GameTests run with `build` (CI): API regression check (SPEC §8.5, §13)
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "femboymod_example-test"
        enableGameTests = true
        enableClientGameTests = false
        eula = true // dev/CI test server only; accepted by the author on 2026-09-25
    }
}

tasks.withType(PublishToMavenRepository).configureEach { enabled = false }
