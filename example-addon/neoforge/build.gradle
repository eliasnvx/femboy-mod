loom {
    mods {
        femboymod {
            sourceSet project(":neoforge").sourceSets.main
        }
    }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    implementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"
    implementation "com.geckolib:geckolib-neoforge-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    // femboymod itself, so `runClient` here starts the mod + the addon
    implementation(project(path: ":neoforge")) { transitive false }
    // femboymod's common code is injected by the Architectury transformer only if listed here
    common(project(path: ":api")) { transitive false }
    common(project(path: ":common")) { transitive false }
    common(project(path: ":example-addon-common")) { transitive false }
}

tasks.withType(PublishToMavenRepository).configureEach { enabled = false }
