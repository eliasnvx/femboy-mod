loom {
    mods {
        femboymod {
            sourceSet project(":neoforge").sourceSets.main
        }
    }
    runs {
        gameTestServer {
            server()
            forgeTemplate("gameTestServer")
            // The 21.1 template starts a plain dedicated server: switch it into test mode explicitly
            property "neoforge.gameTestServer", "true"
            property "neoforge.enabledGameTestNamespaces", "femboymod_example"
            name "Example Addon GameTest Server"
            runDir "build/run/gameTest"
        }
    }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"
    modImplementation "software.bernie.geckolib:geckolib-neoforge-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    // femboymod itself, so `runClient` here starts the mod + the addon
    implementation(project(path: ":neoforge", configuration: "namedElements")) { transitive false }
    // femboymod's common code is injected by the Architectury transformer only if listed here
    common(project(path: ":api", configuration: "namedElements")) { transitive false }
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    common(project(path: ":example-addon-common", configuration: "namedElements")) { transitive false }
}

tasks.withType(PublishToMavenRepository).configureEach { enabled = false }

// Addon GameTests run with `build` (CI): API regression check (SPEC §8.5, §13)
tasks.named("check") { dependsOn "runGameTestServer" }
