// Public API: interfaces, records, codecs, events. Must NOT depend on :common (SPEC §3.1).
architectury {
    common(rootProject.platforms.split(","))
}

version = rootProject.api_version

dependencies {
    // Addons compile against these annotations (@ApiStatus); exported as compile-only
    compileOnlyApi "org.jetbrains:annotations:${rootProject.jetbrains_annotations_version}"
}

java {
    withJavadocJar()
    withSourcesJar()
}

javadoc {
    options.encoding = "UTF-8"
    options.addBooleanOption("Xdoclint:all,-missing", true)
}

// API jar for addon authors: dev.eliasnvx:femboymod-api:<api_version>+<mc> (SPEC §8.1, §14).
// The repository comes from the environment (release workflow); locally: ./gradlew :api:publishToMavenLocal
publishing {
    publications {
        mavenApi(MavenPublication) {
            artifactId = "${rootProject.archives_base_name}-api"
            version = "${rootProject.api_version}+${rootProject.minecraft_version}"
            from components.java
            pom {
                name = "Femboy Mod API"
                description = "Public API for femboymod addons"
                url = "https://github.com/eliasnvx/femboy-mod"
                licenses {
                    license {
                        name = "MIT"
                        url = "https://opensource.org/licenses/MIT"
                    }
                }
                developers {
                    developer {
                        id = "eliasnvx"
                        name = "eliasnvx"
                    }
                }
            }
        }
    }
    repositories {
        def mavenUrl = providers.environmentVariable("FEMBOYMOD_MAVEN_URL").orNull
        if (mavenUrl != null) {
            maven {
                name = "release"
                url = mavenUrl
                credentials {
                    username = providers.environmentVariable("FEMBOYMOD_MAVEN_USER").orNull
                    password = providers.environmentVariable("FEMBOYMOD_MAVEN_PASSWORD").orNull
                }
            }
        }
    }
}
