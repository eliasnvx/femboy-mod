apply plugin: "com.gradleup.shadow"

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"
    modImplementation "software.bernie.geckolib:geckolib-neoforge-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    // Slot mods (SPEC §4.3): wear our cosmetics in their slots. Compile only; -Pcompat_slots=true adds Curios to the dev runtime
    modCompileOnly("maven.modrinth:curios:${rootProject.curios_neoforge_version}") { transitive false }
    modCompileOnly("maven.modrinth:accessories:${rootProject.accessories_neoforge_version}") { transitive false }
    if (project.findProperty("compat_slots") == "true") {
        modRuntimeOnly "maven.modrinth:curios:${rootProject.curios_neoforge_version}"
    }

    common(project(path: ":api", configuration: "namedElements")) { transitive false }
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle(project(path: ":api", configuration: "transformProductionNeoForge")) { transitive false }
    shadowBundle(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

// Server GameTests (SPEC §13): shared bodies in common/.../gametest, registered by FemboyGameTestsNeoForge.
loom {
    runs {
        gameTestServer {
            server()
            forgeTemplate("gameTestServer")
            // The 21.1 template starts a plain dedicated server: switch it into test mode explicitly
            property "neoforge.gameTestServer", "true"
            property "neoforge.enabledGameTestNamespaces", "femboymod"
            name "NeoForge GameTest Server"
            runDir "build/run/gameTest"
        }
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    from rootProject.file("LICENSE")
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
    archiveClassifier = null
    archiveVersion = "${project.version}+${rootProject.minecraft_version}-neoforge"
}

// `build` -> `check` -> GameTests on NeoForge too (Fabric wires runGameTest into build itself).
tasks.named("check") { dependsOn "runGameTestServer" }

apply from: rootProject.file("gradle/publish-mod.gradle")
