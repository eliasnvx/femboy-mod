modLoader = "javafml"
# FML 4.x ships with NeoForge 21.1
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "eliasnvx"
# FML 4 (1.21.1) only knows logoFile: a path from the jar root, shown at the top of the mod list entry
logoFile = "assets/femboymod/banner.png"
logoBlur = false
description = '''
Meme cosmetics mod: programming socks, cat ears, backpacks, energy drinks and more. Comes with a public API for addons.
'''

[[mixins]]
config = "femboymod.mixins.json"

[modproperties.${mod_id}]
api_version = "${api_version}"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},1.21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "architectury"
type = "required"
versionRange = "[${architectury_api_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geckolib"
type = "required"
versionRange = "[${geckolib_version},)"
ordering = "AFTER"
side = "BOTH"
