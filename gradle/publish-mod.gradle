// Modrinth + CurseForge publishing (SPEC §14), applied by :fabric and :neoforge.
// Run by .github/workflows/release.yml on a v* tag. Without tokens it is a dry run:
//   ./gradlew :fabric:publishMods   (prints what would be uploaded)
apply plugin: "me.modmuss50.mod-publish-plugin"

def loader = project.name // "fabric" | "neoforge"
// CurseForge only gives a project id after moderation; until then (id 0) only Modrinth is published
def curseforgeEnabled = rootProject.curseforge_project_id != "0"
def changelogText = providers.provider {
    // Section "## [<version>]" of CHANGELOG.md (Keep a Changelog), up to the next "## ["
    def text = rootProject.file("CHANGELOG.md").getText("UTF-8")
    def matcher = text =~ /(?s)## \[${java.util.regex.Pattern.quote(rootProject.mod_version)}\][^\n]*\n(.*?)(?=\n## \[|\z)/
    matcher.find() ? matcher.group(1).trim() : "See CHANGELOG.md"
}

publishMods {
    file = tasks.remapJar.archiveFile
    changelog = changelogText
    version = "${rootProject.mod_version}+${rootProject.minecraft_version}-${loader}"
    displayName = "${rootProject.mod_version} (${loader == "fabric" ? "Fabric" : "NeoForge"} ${rootProject.minecraft_version})"
    type = rootProject.mod_version.contains("-alpha") ? ALPHA : rootProject.mod_version.contains("-beta") ? BETA : STABLE
    modLoaders.add(loader)
    dryRun = providers.environmentVariable("MODRINTH_TOKEN").orNull == null
            || (curseforgeEnabled && providers.environmentVariable("CURSEFORGE_TOKEN").orNull == null)

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = rootProject.modrinth_project_id
        minecraftVersions.add(rootProject.minecraft_version)
        requires("architectury-api", "geckolib")
        if (loader == "fabric") {
            requires("fabric-api")
            optional("modmenu")
        }
        optional("jei")
    }

    if (curseforgeEnabled) curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = rootProject.curseforge_project_id
        minecraftVersions.add(rootProject.minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        clientRequired = true
        serverRequired = true
        requires("architectury-api", "geckolib")
        if (loader == "fabric") {
            requires("fabric-api")
            optional("modmenu")
        }
        optional("jei")
    }
}
