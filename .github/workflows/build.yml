name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      # Builds api, common, fabric, neoforge and example-addon (API regression check) + JUnit
      - name: Build
        run: ./gradlew build --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: femboymod-jars
          path: |
            fabric/build/libs/*+*-fabric.jar
            neoforge/build/libs/*+*-neoforge.jar
            api/build/libs/*.jar
          if-no-files-found: error

  texgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Fake backend only: no API key in CI, no network calls (SPEC §11.2)
      - name: texgen tests
        run: |
          pip install -e "tools/texgen[dev]"
          python -m pytest tools/texgen

