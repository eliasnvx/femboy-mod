name: release

# Tag v<mod_version> (e.g. v1.0.0).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release # secrets live here; add required reviewers in repo settings
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 17 compiles the 1.20.1 mod (Gradle toolchain), 25 runs Gradle itself
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Check release secrets
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::MODRINTH_TOKEN is not set in the 'release' environment"
            exit 1
          fi
          id=$(grep '^modrinth_project_id=' gradle.properties | cut -d= -f2)
          if ! echo "$id" | grep -Eq '^[A-Za-z0-9]{8}$'; then
            echo "::error::modrinth_project_id must be the 8-character project ID, not the slug (got '$id')"
            exit 1
          fi

      - name: Check tag matches mod_version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version=${version}" >&2
            exit 1
          fi

      # Full build incl. JUnit + GameTests on both loaders; nothing is published if it fails
      - name: Build
        run: ./gradlew build --console=plain

      - name: Publish to Modrinth and CurseForge
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: ./gradlew :fabric:publishMods :neoforge:publishMods --console=plain

      - name: Publish API to Maven
        if: ${{ vars.FEMBOYMOD_MAVEN_URL != '' }}
        env:
          FEMBOYMOD_MAVEN_URL: ${{ vars.FEMBOYMOD_MAVEN_URL }}
          FEMBOYMOD_MAVEN_USER: ${{ secrets.FEMBOYMOD_MAVEN_USER }}
          FEMBOYMOD_MAVEN_PASSWORD: ${{ secrets.FEMBOYMOD_MAVEN_PASSWORD }}
        run: ./gradlew :api:publishMavenApiPublicationToReleaseRepository --console=plain

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            fabric/build/libs/*+*-fabric.jar
            neoforge/build/libs/*+*-neoforge.jar
