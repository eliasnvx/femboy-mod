modLoader = "javafml"
# Forge 47 (1.20.1) language provider
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "eliasnvx"
# Forge 47 mod list shows logoFile (a path from the jar root) at the top of the mod entry
logoFile = "assets/femboymod/banner.png"
logoBlur = false
description = '''
Meme cosmetics mod: programming socks, cat ears, backpacks, energy drinks and more. Comes with a public API for addons.
'''

# Mixins: Forge 47 has no [[mixins]] block, the config is listed in the jar manifest (loom forge.mixinConfig)

[modproperties.${mod_id}]
api_version = "${api_version}"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
# forge_version is "<mc>-<forge>"; the range only takes the Forge part
versionRange = "[${forge_version.substring(forge_version.indexOf('-') + 1)},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},1.20.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "architectury"
mandatory = true
versionRange = "[${architectury_api_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geckolib"
mandatory = true
versionRange = "[${geckolib_version},)"
ordering = "AFTER"
side = "BOTH"
