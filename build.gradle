plugins {
    id "architectury-plugin" version "3.5.170"
    id "dev.architectury.loom" version "1.17.493" apply false
    id "com.gradleup.shadow" version "9.4.3" apply false
    id "me.modmuss50.mod-publish-plugin" version "2.2.1" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: "java-library"
    apply plugin: "architectury-plugin"
    apply plugin: "dev.architectury.loom"
    apply plugin: "maven-publish"

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    repositories {
        maven { url "https://maven.neoforged.net/releases/" }
        maven { url "https://maven.minecraftforge.net/" }
        maven { url "https://maven.architectury.dev/" }
        exclusiveContent {
            forRepository { maven { url "https://maven.blamejared.com/" } }
            filter { includeGroup "mezz.jei"; includeGroup "net.mezzdev.config" }
        }
        // Dev-only compat mods (Sodium/Iris smoke test, see fabric/build.gradle)
        exclusiveContent {
            forRepository { maven { url "https://api.modrinth.com/maven" } }
            filter { includeGroup "maven.modrinth" }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "GeckoLib"
                    url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
                }
            }
            filter { includeGroupAndSubgroups("com.geckolib"); includeGroupAndSubgroups("software.bernie"); includeGroupAndSubgroups("com.eliotlash") }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
        compileOnly "org.jetbrains:annotations:${rootProject.jetbrains_annotations_version}"

        testImplementation platform("org.junit:junit-bom:${rootProject.junit_version}")
        testImplementation "org.junit.jupiter:junit-jupiter"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    }

    java {
        withSourcesJar()
        toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = rootProject.java_version as int
        options.compilerArgs += ["-Xmaxerrs", "10000"]
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    processResources {
        def props = [
                version          : project.version,
                mod_id           : rootProject.mod_id,
                mod_name         : rootProject.mod_name,
                api_version      : rootProject.api_version,
                minecraft_version: rootProject.minecraft_version,
                fabric_loader_version: rootProject.fabric_loader_version,
                fabric_api_version: rootProject.fabric_api_version.split("\\+")[0],
                forge_version    : rootProject.forge_version,
                architectury_api_version: rootProject.architectury_api_version,
                geckolib_version : rootProject.geckolib_version,
        ]
        inputs.properties props
        filesMatching(["fabric.mod.json", "META-INF/mods.toml", "META-INF/femboymod-api.properties"]) {
            expand props
        }
    }
}
