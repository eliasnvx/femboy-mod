apply plugin: "com.gradleup.shadow"

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

repositories {
    maven { url "https://maven.terraformersmc.com/" }
    // Cardinal Components (Trinkets' API types), compile only
    exclusiveContent {
        forRepository { maven { url "https://maven.ladysnake.org/releases" } }
        filter { includeGroup "dev.onyxstudios.cardinal-components-api" }
    }
}

dependencies {
    // Optional: config button in Mod Menu (SPEC §9)
    modCompileOnly("com.terraformersmc:modmenu:${rootProject.modmenu_version}") { transitive false }
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modImplementation "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    // Slot mods (SPEC §4.3): wear our cosmetics in their slots. Compile only; -Pcompat_slots=true adds Trinkets to the dev runtime
    modCompileOnly("maven.modrinth:trinkets:${rootProject.trinkets_fabric_version}") { transitive false }
    modCompileOnly("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${rootProject.cca_version}") { transitive false }
    modCompileOnly("maven.modrinth:accessories:${rootProject.accessories_fabric_version}") { transitive false }
    if (project.findProperty("compat_slots") == "true") {
        modRuntimeOnly "maven.modrinth:trinkets:${rootProject.trinkets_fabric_version}"
        modRuntimeOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${rootProject.cca_version}"
        modRuntimeOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${rootProject.cca_version}"
    }

    // Compat smoke test (SPEC §9): ./gradlew :fabric:runClientGameTest -Pcompat_render=true
    // loads Sodium + Iris into the dev runtime only. Never a compile dependency.
    if (project.findProperty("compat_render") == "true") {
        modRuntimeOnly "maven.modrinth:sodium:${rootProject.sodium_fabric_version}"
        modRuntimeOnly "maven.modrinth:iris:${rootProject.iris_fabric_version}"
    }
    // Figura compat check (no Figura for 26.x): ./gradlew :fabric:runCompatClient -Pcompat_figura=true (CompatHarness)
    if (project.findProperty("compat_figura") == "true") {
        modRuntimeOnly "maven.modrinth:figura:${rootProject.figura_fabric_version}"
    }
    // JEI compat check (SPEC §9): ./gradlew :fabric:runClient -Pcompat_jei=true
    if (project.findProperty("compat_jei") == "true") {
        modRuntimeOnly "mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}"
    }

    common(project(path: ":api", configuration: "namedElements")) { transitive false }
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle(project(path: ":api", configuration: "transformProductionFabric")) { transitive false }
    shadowBundle(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

// Server GameTests (SPEC §13): shared bodies in common/.../gametest, Fabric glue in src/gametest.
// They run as part of `build` via the generated `runGameTest` task.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "femboymod-test"
        enableGameTests = true
        // Client tests open a real window (screenshots of cosmetics); run manually: ./gradlew :fabric:runClientGameTest
        enableClientGameTests = false // 1.21.1 Fabric API has no client GameTest API (fabric-client-gametest-api-v1)
        eula = true // dev/CI test server only; accepted by the author on 2026-09-25
    }
}

// Compat screenshots: 1.20.1 has no client GameTest API, so CompatHarness (src/gametest) drives the client itself.
// ./gradlew :fabric:runCompatClient [-Pcompat_figura=true]; files in build/run/compatClient/screenshots
loom {
    runs {
        compatClient {
            client()
            name "Compat Client"
            source sourceSets.gametest
            runDir "build/run/compatClient"
            property "femboymod.compat_harness", "true"
            // -Pharness_scene=pets|halloween|mobs|interior|mirror picks another CompatHarness scene
            property "femboymod.harness_scene", project.findProperty("harness_scene") ?: "compat"
            programArgs "--width", "1600", "--height", "900"
        }
    }
}

// The same harness in a production-like client (intermediary jars, as players run it), for mods that don't start in dev
// (Figura's accessors clash with Mojang names): ./gradlew :fabric:runProdCompatClient [-Pcompat_figura=true];
// files in build/run/prodCompatClient/screenshots
configurations {
    prodCompatMods { transitive = false }
}
dependencies {
    prodCompatMods "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    prodCompatMods "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"
    prodCompatMods "software.bernie.geckolib:geckolib-fabric-${rootProject.minecraft_version}:${rootProject.geckolib_version}"
    if (project.findProperty("compat_figura") == "true") {
        prodCompatMods "maven.modrinth:figura:${rootProject.figura_fabric_version}"
    }
}
def compatHarnessJar = tasks.register("compatHarnessJar", Jar) {
    from sourceSets.gametest.output
    archiveClassifier = "compat-harness-dev"
}
def remapCompatHarnessJar = tasks.register("remapCompatHarnessJar", net.fabricmc.loom.task.RemapJarTask) {
    inputFile = compatHarnessJar.flatMap { it.archiveFile }
    archiveClassifier = "compat-harness"
}
tasks.register("runProdCompatClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(remapJar, remapCompatHarnessJar, configurations.prodCompatMods)
    jvmArgs.add("-Dfemboymod.compat_harness=true")
    // -Pharness_scene=pets|halloween|mobs|interior|mirror picks another CompatHarness scene
    jvmArgs.add("-Dfemboymod.harness_scene=${project.findProperty("harness_scene") ?: "compat"}")
    programArgs.addAll("--width", "1600", "--height", "900")
    runDir = layout.buildDirectory.dir("run/prodCompatClient")
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
    exclude "architectury.common.json"
    from rootProject.file("LICENSE")
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
    archiveClassifier = null
    archiveVersion = "${project.version}+${rootProject.minecraft_version}-fabric"
}

apply from: rootProject.file("gradle/publish-mod.gradle")
