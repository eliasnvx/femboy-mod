apply plugin: "com.gradleup.shadow"

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

repositories {
    maven { url "https://maven.terraformersmc.com/" }
}

dependencies {
    // Optional: config button in Mod Menu (SPEC §9)
    compileOnly("com.terraformersmc:modmenu:${rootProject.modmenu_version}") { transitive false }
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    implementation "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"
    implementation "com.geckolib:geckolib-fabric-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    // Compat smoke test (SPEC §9): ./gradlew :fabric:runClientGameTest -Pcompat_render=true
    // loads Sodium + Iris into the dev runtime only. Never a compile dependency.
    if (project.findProperty("compat_render") == "true") {
        runtimeOnly "maven.modrinth:sodium:${rootProject.sodium_fabric_version}"
        runtimeOnly "maven.modrinth:iris:${rootProject.iris_fabric_version}"
    }
    // Map mods smoke test: ./gradlew :fabric:runClientGameTest -Pcompat_maps=true (MapModsClientTest)
    if (project.findProperty("compat_maps") == "true") {
        runtimeOnly "maven.modrinth:xaeros-world-map:${rootProject.xaero_worldmap_fabric_version}"
        runtimeOnly "maven.modrinth:xaeros-minimap:${rootProject.xaero_minimap_fabric_version}"
        runtimeOnly "maven.modrinth:journeymap:${rootProject.journeymap_fabric_version}"
    }
    // Model/skin mods smoke test: ./gradlew :fabric:runClientGameTest -Pcompat_models=true (CompatModelsClientTest);
    // or a comma list of etf, emf (needs etf), skinlayers, firstperson, emotecraft to load only some of them
    def compatModels = (project.findProperty("compat_models") ?: "").toString()
    def modelMods = compatModels == "true" ? ["etf", "emf", "skinlayers", "firstperson", "emotecraft"] : compatModels.tokenize(",")
    if (modelMods.contains("emf")) {
        runtimeOnly "maven.modrinth:entity-model-features:${rootProject.emf_fabric_version}"
    }
    if (modelMods.contains("etf")) {
        runtimeOnly "maven.modrinth:entitytexturefeatures:${rootProject.etf_fabric_version}"
    }
    if (modelMods.contains("skinlayers")) {
        runtimeOnly "maven.modrinth:3dskinlayers:${rootProject.skinlayers_fabric_version}"
    }
    if (modelMods.contains("firstperson")) {
        runtimeOnly "maven.modrinth:first-person-model:${rootProject.firstperson_fabric_version}"
        runtimeOnly "maven.modrinth:not-enough-animations:${rootProject.notenoughanimations_fabric_version}"
    }
    if (modelMods.contains("emotecraft")) {
        runtimeOnly "maven.modrinth:emotecraft:${rootProject.emotecraft_fabric_version}"
        runtimeOnly "maven.modrinth:player-animation-library:${rootProject.playeranimationlib_fabric_version}"
    }
    // JEI compat check (SPEC §9): ./gradlew :fabric:runClient -Pcompat_jei=true
    if (project.findProperty("compat_jei") == "true") {
        runtimeOnly "mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}"
    }

    common(project(path: ":api")) { transitive false }
    common(project(path: ":common")) { transitive false }
    shadowBundle(project(path: ":api", configuration: "transformProductionFabric")) { transitive false }
    shadowBundle(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

// Server GameTests (SPEC §13): shared bodies in common/.../gametest, Fabric glue in src/gametest.
// They run as part of `build` via the generated `runGameTest` task.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "femboymod-test"
        enableGameTests = true
        // Client tests open a real window (screenshots of cosmetics); run manually: ./gradlew :fabric:runClientGameTest
        enableClientGameTests = true
        eula = true // dev/CI test server only; accepted by the author on 2026-09-25
    }
}

jar {
    archiveClassifier = "raw"
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
    archiveVersion = "${project.version}+${rootProject.minecraft_version}-fabric"
    exclude "architectury.common.json"
    from rootProject.file("LICENSE")
}

assemble.dependsOn shadowJar

apply from: rootProject.file("gradle/publish-mod.gradle")
