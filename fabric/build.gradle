apply plugin: "com.gradleup.shadow"

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

repositories {
    maven { url "https://maven.terraformersmc.com/" }
}

dependencies {
    // Optional: config button in Mod Menu (SPEC §9)
    modCompileOnly("com.terraformersmc:modmenu:${rootProject.modmenu_version}") { transitive false }
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modImplementation "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    // Compat smoke test (SPEC §9): ./gradlew :fabric:runClientGameTest -Pcompat_render=true
    // loads Sodium + Iris into the dev runtime only. Never a compile dependency.
    if (project.findProperty("compat_render") == "true") {
        modRuntimeOnly "maven.modrinth:sodium:${rootProject.sodium_fabric_version}"
        modRuntimeOnly "maven.modrinth:iris:${rootProject.iris_fabric_version}"
    }
    // JEI compat check (SPEC §9): ./gradlew :fabric:runClient -Pcompat_jei=true
    if (project.findProperty("compat_jei") == "true") {
        modRuntimeOnly "mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}"
    }

    common(project(path: ":api", configuration: "namedElements")) { transitive false }
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle(project(path: ":api", configuration: "transformProductionFabric")) { transitive false }
    shadowBundle(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

// Server GameTests (SPEC §13): shared bodies in common/.../gametest, Fabric glue in src/gametest.
// They run as part of `build` via the generated `runGameTest` task.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "femboymod-test"
        enableGameTests = true
        // Client tests open a real window (screenshots of cosmetics); run manually: ./gradlew :fabric:runClientGameTest
        enableClientGameTests = false // 1.21.1 Fabric API has no client GameTest API (fabric-client-gametest-api-v1)
        eula = true // dev/CI test server only; accepted by the author on 2026-09-25
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
    exclude "architectury.common.json"
    from rootProject.file("LICENSE")
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
    archiveClassifier = null
    archiveVersion = "${project.version}+${rootProject.minecraft_version}-fabric"
}

apply from: rootProject.file("gradle/publish-mod.gradle")
